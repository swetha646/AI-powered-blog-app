{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification – Awaaz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
  min-height: 100vh;
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(191, 219, 254, 0.75),
      transparent 55%
    ),
    radial-gradient(
      circle at bottom right,
      rgba(224, 242, 254, 0.7),
      transparent 55%
    ),
    #f4f6fb;
}


    /* Logo */
    .logo-img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }

    /* OTP input */
    .otp-input {
      letter-spacing: 0.6em;
    }
  </style>
</head>

<body class="min-h-screen bg-[#f4f6fb] flex items-center justify-center px-6">

  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <img
        src="{% static 'images/logo.jpeg' %}"
        alt="Awaaz Logo"
        class="logo-img mx-auto mb-4"
      >

      <h1 class="text-3xl font-extrabold text-[#1e1b4b] mb-2">
        Verify your account
      </h1>

      <p class="text-gray-500 text-sm">
        We sent a one-time password to
        <span class="font-semibold text-gray-700">{{ c.Username }}</span>
      </p>
    </div>

    <!-- OTP Card -->
    <div class="bg-white rounded-3xl p-8 shadow-xl border border-gray-200">

      <form method="post" class="space-y-6">
        {% csrf_token %}

        <!-- OTP Input -->
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-2">
            Enter OTP
          </label>

          <input
            type="text"
            name="otp"
            maxlength="6"
            required
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="••••••"
            class="otp-input w-full text-center text-2xl px-4 py-4 rounded-xl
                   border border-gray-300 bg-white text-gray-900
                   focus:outline-none focus:ring-4 focus:ring-indigo-500/20
                   focus:border-indigo-500"
          >
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full py-4 rounded-2xl font-bold text-white
                 bg-gradient-to-r from-indigo-600 to-purple-600
                 hover:scale-[1.02] transition"
        >
          Verify & Continue
        </button>
      </form>

      <!-- Footer links -->
      <div class="text-center mt-6 space-y-2">
        <a href="/login" class="text-sm text-gray-500 hover:text-indigo-600 transition">
          ← Back to Login
        </a>
        <p class="text-xs text-gray-400">
          Secure login with one-time verification
        </p>
      </div>

    </div>

  </div>

</body>
</html>
