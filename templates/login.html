{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Awaaz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Logo */
    .logo-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: #ffffff;
    }
  </style>
</head>

<body class="min-h-screen bg-[#f4f6fb]">

<!-- MAIN WRAPPER -->
<div class="min-h-screen grid grid-cols-1 md:grid-cols-2">

  <!-- LEFT BRAND PANEL -->
  <div class="hidden md:flex flex-col justify-center px-16
              bg-gradient-to-br from-indigo-900 via-indigo-800 to-indigo-700 text-white">

    <img
      src="{% static 'images/logo.jpeg' %}"
      alt="Awaaz Logo"
      class="logo-img mb-6"
    >

    <h1 class="text-4xl font-extrabold mb-4 leading-tight">
      Your voice,<br>your space.
    </h1>

    <p class="text-indigo-200 text-lg max-w-md">
      Write freely. Speak honestly.  
      Awaaz is your calm corner on the internet.
    </p>

    <p class="mt-12 text-sm text-indigo-300 tracking-wide">
      write • speak • vibe • repeat
    </p>
  </div>

  <!-- RIGHT LOGIN PANEL -->
  <div class="flex items-center justify-center px-6">

    <div class="w-full max-w-md">

      <!-- Mobile Header -->
      <div class="md:hidden text-center mb-8">
        <img
          src="{% static 'images/logo.jpeg' %}"
          alt="Awaaz Logo"
          class="logo-img mx-auto mb-4"
        >
        <h2 class="text-2xl font-extrabold text-[#1e1b4b]">
          Welcome back
        </h2>
        <p class="text-gray-500">
          Log in to continue
        </p>
      </div>

      <!-- Login Card -->
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-gray-200">

        <form method="post" class="space-y-5">
          {% csrf_token %}

          <!-- Email -->
          <div>
            <label class="text-sm font-semibold text-gray-600 mb-1 block">
              Email
            </label>
            <input
              type="email"
              name="username"
              required
              placeholder="you@awaaz.com"
              class="w-full px-5 py-4 rounded-2xl border border-gray-300 bg-white text-gray-900
                     focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500"
            >
          </div>

          <!-- Password with Eye Toggle -->
          <div class="relative">
            <label class="text-sm font-semibold text-gray-600 mb-1 block">
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              class="w-full px-5 py-4 rounded-2xl border border-gray-300 bg-white text-gray-900 pr-14
                     focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500"
            >

            <!-- Eye Toggle -->
            <button
              type="button"
              id="togglePassword"
              class="absolute right-4 top-[42px] text-gray-400 hover:text-indigo-600 transition"
            >
              <!-- Eye Open -->
              <svg id="eyeOpen" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7"/>
              </svg>

              <!-- Eye Closed -->
              <svg id="eyeClosed" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-width="2" d="M3 3l18 18"/>
                <path stroke-width="2" d="M10.58 10.58a3 3 0 104.24 4.24"/>
              </svg>
            </button>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full py-4 rounded-2xl font-bold text-white
                   bg-gradient-to-r from-indigo-600 to-purple-600
                   hover:scale-[1.02] transition"
          >
            Log in
          </button>
        </form>

        <!-- Signup Link -->
        <p class="text-center text-sm mt-6 text-gray-500">
          New here?
          <a href="{% url 'signup' %}" class="font-semibold text-indigo-600 hover:underline">
            Create an account
          </a>
        </p>

      </div>

      <!-- Footer Text -->
      <p class="text-center mt-6 text-xs text-gray-400 tracking-wide">
        write • speak • vibe • repeat
      </p>

    </div>
  </div>

</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');

  togglePassword.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeOpen.classList.remove('hidden');
      eyeClosed.classList.add('hidden');
    } else {
      passwordInput.type = 'password';
      eyeOpen.classList.add('hidden');
      eyeClosed.classList.remove('hidden');
    }
  });
</script>

</body>
</html>
